        function App() {
            const [selectedCategory, setSelectedCategory] = useState("TODOS");
            const [searchQuery, setSearchQuery] = useState("");
            const [cart, setCart] = useState([]);
            const [showCart, setShowCart] = useState(false);
            const [showMenu, setShowMenu] = useState(false);
            const [selectedSizes, setSelectedSizes] = useState({});
            const [selectedColors, setSelectedColors] = useState({});
            const [selectedImageIndices, setSelectedImageIndices] = useState({});
            const [shippingType, setShippingType] = useState("retiro");
            const [customerNotes, setCustomerNotes] = useState("");
            const [activeSlide, setActiveSlide] = useState(0);
            const imageTouchStarts = useRef({});

            // Setup default selected size & color per product
            useEffect(() => {
                const initSizes = {};
                const initColors = {};
                PRODUCTS.forEach(p => {
                    initSizes[p.id] = p.sizes[0];
                    initColors[p.id] = p.colors[0];
                });
                setSelectedSizes(initSizes);
                setSelectedColors(initColors);
            }, []);

            useEffect(() => {
                const carouselInterval = setInterval(() => {
                    setActiveSlide(currentSlide => (currentSlide + 1) % HERO_SLIDES.length);
                }, 2000);

                return () => clearInterval(carouselInterval);
            }, []);

            // Costos de envío personalizables
            const shippingCosts = {
                retiro: 0,
                caba: 4500,
                gba: 6500,
                correo: 7500
            };

            const handleSizeChange = (productId, size) => {
                setSelectedSizes(prev => ({ ...prev, [productId]: size }));
            };

            const handleColorChange = (productId, color) => {
                setSelectedColors(prev => ({ ...prev, [productId]: color }));

                const product = PRODUCTS.find(item => item.id === productId);
                const colorImage = product?.imagesByColor?.[color];
                const imageIndex = product ? getProductImages(product).indexOf(colorImage) : -1;

                if (imageIndex >= 0) {
                    setSelectedImageIndices(prev => ({ ...prev, [productId]: imageIndex }));
                }
            };

            const handleImageTouchStart = (productId, event) => {
                imageTouchStarts.current[productId] = event.touches[0].clientX;
            };

            const handleImageTouchEnd = (product, event) => {
                const startX = imageTouchStarts.current[product.id];
                const endX = event.changedTouches[0].clientX;
                const swipeDistance = endX - startX;

                delete imageTouchStarts.current[product.id];

                const images = getProductImages(product);

                if (startX === undefined || images.length < 2 || Math.abs(swipeDistance) < 40) {
                    return;
                }

                setSelectedImageIndices(prev => {
                    const currentIndex = prev[product.id] || 0;
                    const nextIndex = swipeDistance < 0
                        ? (currentIndex + 1) % images.length
                        : (currentIndex - 1 + images.length) % images.length;
                    return { ...prev, [product.id]: nextIndex };
                });
            };

            const addToCart = (product) => {
                const size = selectedSizes[product.id] || product.sizes[0];
                const color = selectedColors[product.id] || product.colors[0];
                const cartItemId = `${product.id}-${size}-${color}`;

                const cartItem = {
                    ...product,
                    cartItemId,
                    selectedSize: size,
                    selectedColor: color,
                    quantity: 1
                };

                setCart(prev => {
                    const existingIndex = prev.findIndex(item => item.cartItemId === cartItemId);
                    if (existingIndex > -1) {
                        const updated = [...prev];
                        updated[existingIndex].quantity += 1;
                        return updated;
                    }
                    return [...prev, cartItem];
                });
            };

            const updateCartQuantity = (cartItemId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.cartItemId === cartItemId) {
                        const newQty = Math.max(1, item.quantity + delta);
                        return { ...item, quantity: newQty };
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const removeFromCart = (cartItemId) => {
                setCart(prev => prev.filter(item => item.cartItemId !== cartItemId));
            };

            const clearCart = () => {
                if (window.confirm("¿Querés vaciar el carrito? Esta acción no se puede deshacer.")) {
                    setCart([]);
                    setCustomerNotes("");
                    setShippingType("retiro");
                }
            };

            // Filters
            const filteredProducts = useMemo(() => {
                return PRODUCTS.filter(p => {
                    const matchesCategory = selectedCategory === "TODOS" || p.category === selectedCategory;
                    const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        p.description.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                });
            }, [selectedCategory, searchQuery]);

            const subtotal = useMemo(() => {
                return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            }, [cart]);

            const shippingPrice = shippingCosts[shippingType] || 0;
            const total = subtotal + shippingPrice;

            // Enviar Pedido formateado a WhatsApp
            const handleCheckoutWhatsApp = () => {
                let message = `🌸 *NUEVO PEDIDO - ROSÉ LENCERÍA* 🌸\n\n`;
                message += `*Detalle de la compra:*\n`;

                cart.forEach((item, idx) => {
                    message += `${idx + 1}. *${item.name}*\n`;
                    message += `   └ Talle: *${item.selectedSize}* | Color: *${item.selectedColor}*\n`;
                    message += `   └ Cantidad: ${item.quantity} x $${item.price.toLocaleString('es-AR')} = *$${(item.price * item.quantity).toLocaleString('es-AR')}*\n\n`;
                });

                message += `-----------------------------------\n`;
                message += `*Subtotal:* $${subtotal.toLocaleString('es-AR')}\n`;

                const shippingLabel = {
                    retiro: "Retiro en Showroom / Local (Sin Cargo)",
                    caba: "Envío Mensajería CABA ($" + shippingCosts.caba.toLocaleString('es-AR') + ")",
                    gba: "Envío Mensajería GBA ($" + shippingCosts.gba.toLocaleString('es-AR') + ")",
                    correo: "Envío Correo Argentino ($" + shippingCosts.correo.toLocaleString('es-AR') + ")"
                }[shippingType];

                message += `*Opción de Entrega:* ${shippingLabel}\n`;
                if (customerNotes.trim()) {
                    message += `*Aclaraciones:* ${customerNotes.trim()}\n`;
                }
                message += `-----------------------------------\n`;
                message += `💰 *TOTAL A PAGAR: $${total.toLocaleString('es-AR')}*\n\n`;
                message += `¡Hola! Quisiera coordinar el pago y la entrega de este pedido. 💕`;

                const encodedMessage = encodeURIComponent(message);
                window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodedMessage}`, '_blank');
            };

            return (
                <div className="min-h-screen pb-28">
                    {/* Main Header */}
                    <header className="sticky top-0 z-30 border-b border-white/10 bg-[#292929] shadow-sm">
                        <div className="mx-auto flex max-w-6xl items-center justify-between px-5 py-2 sm:px-8">

                                onClick={() => setShowMenu(true)}
                                className="p-2 text-roseDark transition-colors hover:text-roseMagenta active:scale-95"

                                        }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* Hero Carousel */}
                    <section className="relative w-full overflow-hidden border-b border-roseAccent/60 bg-[#151315]">
                        <div
                            className="flex transition-transform duration-700 ease-in-out"
                            style={{ transform: `translateX(-${activeSlide * 100}%)` }}
                        >
                            {HERO_SLIDES.map((slide, index) => (
                                <article key={slide.title} className="relative h-[260px] w-full shrink-0 sm:h-[360px] lg:h-[480px]">
                                    <img
                                        src={slide.image}
                                        alt={slide.title}
                                        className="h-full w-full object-cover object-center"
                                    />
                                    <div className="absolute inset-0 bg-gradient-to-r from-black/75 via-black/35 to-transparent" />
                                    <div className="absolute inset-0 mx-auto flex max-w-6xl items-center px-6 sm:px-12">
                                        <div className="max-w-sm">
                                            <p className="font-brand text-[10px] font-bold tracking-[0.28em] text-roseMagenta uppercase">ROSÉ Lencería</p>
                                            <h1 className="mt-2 font-display text-4xl font-semibold leading-tight text-white sm:text-6xl">{slide.title}</h1>
                                            <p className="mt-3 text-sm text-white/85 sm:text-base">{slide.subtitle}</p>
                                            <button
                                                onClick={() => setSelectedCategory(slide.category)}
                                                className="mt-5 rounded-full bg-roseMagenta px-5 py-2.5 font-brand text-[11px] font-bold tracking-wider text-white uppercase transition-colors hover:bg-white hover:text-[#151315]"
                                            >
                                                Ver colección
                                            </button>
                                        </div>
                                    </div>
                                </article>
                            ))}
                        </div>
                        <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 gap-2">
                            {HERO_SLIDES.map((slide, index) => (
                                <button
                                    key={slide.title}
                                    onClick={() => setActiveSlide(index)}
                                    aria-label={`Ver imagen ${index + 1}`}
                                    className={`h-2 rounded-full transition-all ${activeSlide === index ? 'w-6 bg-roseMagenta' : 'w-2 bg-white/70'}`}
                                />
                            ))}
                        </div>
                    </section>

                    {/* Category Showcase */}
                    <section className="border-b border-roseAccent/60 bg-[#f5eded] px-4 py-10 sm:px-6 sm:py-14">
                        <div className="mx-auto max-w-6xl">
                            <div className="mb-6 text-center">
                                <p className="font-brand text-[10px] font-bold tracking-[0.28em] text-roseMagenta uppercase">Elegí tu estilo</p>
                                <h2 className="mt-2 font-brand text-2xl font-black tracking-wide text-[#1A1A1A] uppercase sm:text-3xl">Explorá por categoría</h2>
                            </div>
                            <div className="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4">
                                {CATEGORIES.map(category => {
                                    const categoryProduct = PRODUCTS.find(product => product.category === category);
                                    return (
                                        <button
                                            key={category}
                                            onClick={() => {
                                                setSelectedCategory(category);
                                                document.getElementById('catalogo')?.scrollIntoView({ behavior: 'smooth' });
                                            }}
                                            className="group relative aspect-[3/4] overflow-hidden rounded-2xl border border-white/10 bg-[#292529] text-left shadow-lg"
                                        >
                                            <img
                                                src={CATEGORY_IMAGES[category] || categoryProduct.image}
                                                alt={`Colección ${category}`}
                                                className="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
                                                loading="lazy"
                                            />
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent" />
                                            <div className="absolute inset-x-0 bottom-0 p-4">
                                                <h3 className="font-brand text-lg font-black tracking-wide text-white uppercase sm:text-xl">{category}</h3>
                                                <span className="mt-2 inline-flex rounded-full bg-white px-3 py-1.5 font-brand text-[10px] font-bold tracking-wider text-[#1C191C] uppercase transition-colors group-hover:bg-roseMagenta group-hover:text-white">
                                                    Ver todo
                                                </span>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </section>

                    {/* Main Content Area */}
                    <main id="catalogo" className="mx-auto max-w-6xl px-4 pt-8 space-y-6 sm:px-6">

                        {/* Dynamic Category Title Banner */}
                        <div className="flex justify-between items-center border-b border-roseAccent pb-2">
                            <h2 className="font-brand font-bold tracking-widest text-sm text-roseDark uppercase flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-roseMagenta"></span>
                                {selectedCategory === "TODOS" ? "Colección Completa" : `Categoría: ${selectedCategory}`}
                            </h2>
                            <span className="text-[11px] font-medium text-gray-500">
                                {filteredProducts.length} {filteredProducts.length === 1 ? 'modelo' : 'modelos'}
                            </span>
                        </div>

                        {filteredProducts.length === 0 ? (
                            <div className="text-center py-12 bg-white rounded-2xl p-6 border border-roseAccent">
                                <p className="text-roseDark font-brand font-semibold text-sm">No encontramos productos en esta búsqueda</p>
                                <p className="text-xs text-gray-500 mt-1">Probá cambiando el filtro o la palabra clave.</p>
                                <button
                                    onClick={() => { setSelectedCategory("TODOS"); setSearchQuery(""); }}
                                    className="mt-4 px-5 py-2 bg-roseMagenta text-white rounded-full text-xs font-bold font-brand tracking-wider uppercase"
                                >
                                    Ver Todo el Catálogo
                                </button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
                                {filteredProducts.map(product => {
                                    const currentColor = selectedColors[product.id] || product.colors[0];
                                    const currentSize = selectedSizes[product.id] || product.sizes[0];
                                    const selectedImageIndex = selectedImageIndices[product.id] || 0;
                                    const productImages = getProductImages(product);

                                    return (
                                        <div
                                            key={product.id}
                                            className="overflow-hidden border border-white/10 bg-[#201D20] shadow-sm transition-shadow hover:shadow-xl"
                                        >
                                            <div
                                                className="relative aspect-[4/5] overflow-hidden group touch-pan-y"
                                                onTouchStart={(event) => handleImageTouchStart(product.id, event)}
                                                onTouchEnd={(event) => handleImageTouchEnd(product, event)}
                                            >
                                                <img
                                                    src={getProductImage(product, currentColor, selectedImageIndex)}
                                                    alt={product.name}
                                                    className="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500"
                                                    loading="lazy"
                                                />
                                                {product.unavailableImageColors?.includes(currentColor) && (
                                                    <span className="absolute right-3 top-3 rounded-full bg-black/65 px-3 py-1.5 text-[10px] font-bold tracking-wide text-white uppercase backdrop-blur-sm">
                                                        Imagen próximamente
                                                    </span>
                                                )}
                                                {productImages.length > 1 && (
                                                    <>
                                                        <button
                                                            onClick={() => setSelectedImageIndices(prev => ({ ...prev, [product.id]: (selectedImageIndex - 1 + productImages.length) % productImages.length }))}
                                                            aria-label={`Ver imagen anterior de ${product.name}`}
                                                            className="absolute left-3 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full bg-black/40 text-lg text-white backdrop-blur-sm transition-colors hover:bg-black/65"
                                                        >
                                                            ‹
                                                        </button>
                                                        <button
                                                            onClick={() => setSelectedImageIndices(prev => ({ ...prev, [product.id]: (selectedImageIndex + 1) % productImages.length }))}
                                                            aria-label={`Ver imagen siguiente de ${product.name}`}
                                                            className="absolute right-3 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full bg-black/40 text-lg text-white backdrop-blur-sm transition-colors hover:bg-black/65"
                                                        >
                                                            ›
                                                        </button>
                                                        <div className="absolute bottom-3 left-1/2 flex -translate-x-1/2 gap-1.5 rounded-full bg-black/35 px-2 py-1.5 backdrop-blur-sm" aria-label="Vistas del producto">
                                                            {productImages.map((image, imageIndex) => (
                                                                <button
                                                                    key={image}
                                                                    onClick={() => setSelectedImageIndices(prev => ({ ...prev, [product.id]: imageIndex }))}
                                                                    aria-label={`Ver imagen ${imageIndex + 1} de ${product.name}`}
                                                                    aria-pressed={selectedImageIndex === imageIndex}
                                                                    className={`h-2 w-2 rounded-full transition-transform ${selectedImageIndex === imageIndex ? 'scale-125 bg-white' : 'bg-white/60 hover:bg-white'}`}
                                                                />
                                                            ))}
                                                        </div>
                                                    </>
                                                )}
                                            </div>

                                            <div className="flex flex-1 flex-col items-start p-5">
                                                <div className="flex w-full items-center justify-between gap-3 border-b border-white/10 pb-4">
                                                    <div className="flex items-center gap-2" aria-label="Opciones de color">
                                                        {product.colors.map(color => {
                                                            const isSelected = currentColor === color;
                                                            return (
                                                                <button
                                                                    key={color}
                                                                    onClick={() => handleColorChange(product.id, color)}
                                                                    aria-label={`Color ${color}`}
                                                                    aria-pressed={isSelected}
                                                                    title={color}
                                                                    className={`h-5 w-5 rounded-full border transition-transform ${isSelected ? 'scale-110 border-white ring-2 ring-roseMagenta ring-offset-2 ring-offset-[#201D20]' : 'border-white/30 hover:scale-110'}`}
                                                                    style={getSwatchStyle(product, color)}
                                                                />
                                                            );
                                                        })}
                                                    </div>
                                                    <span className="font-brand text-[10px] font-bold tracking-wider text-roseDark uppercase">{product.brand || "ANDRESSA"}</span>
                                                </div>
                                                <h3 className="mt-4 font-sans text-[15px] font-medium leading-snug text-roseDark">
                                                    {product.name}
                                                </h3>
                                                <div className="mt-4">
                                                    <span className="font-brand text-[10px] font-bold tracking-[0.14em] text-gray-400 uppercase">Talle</span>
                                                    <div className="mt-2 flex flex-wrap gap-1.5">
                                                        {product.sizes.map(size => (
                                                            <button
                                                                key={size}
                                                                onClick={() => handleSizeChange(product.id, size)}
                                                                aria-pressed={currentSize === size}
                                                                className={`min-w-8 rounded-full border px-2 py-1 text-[10px] font-bold transition-colors ${currentSize === size
                                                                    ? 'border-roseMagenta bg-roseMagenta text-white'
                                                                    : 'border-white/20 text-roseDark hover:border-roseMagenta'
                                                                    }`}
                                                            >
                                                                {size}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <span className="mt-3 font-sans text-xl font-semibold text-white">
                                                    ${product.price.toLocaleString('es-AR')}
                                                </span>
                                                <button
                                                    onClick={() => addToCart(product)}
                                                    className="mt-5 rounded-full bg-[#101010] px-7 py-2.5 font-sans text-xs font-semibold text-white transition-colors hover:bg-roseMagenta"
                                                >
                                                    Comprar
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>

                    { }
                    {showMenu && (
                        <div className="fixed inset-0 z-50 flex justify-start">
                            {/* Backdrop */}
                            <div
                                className="absolute inset-0 bg-roseDark/60 backdrop-blur-sm transition-opacity"
                                onClick={() => setShowMenu(false)}
                            />

                            {/* Left Drawer Panel */}
                            <div className="relative w-full max-w-xs bg-white h-full shadow-2xl flex flex-col animate-slide-in-left z-10">
                                {/* Drawer Header */}
                                <div className="p-4 border-b border-roseAccent flex items-center justify-between bg-[#292929]">
                                    <div className="relative h-14 w-14 overflow-hidden" aria-label="ROSÉ Lencería">
                                        <img
                                            src="assets/logo-rose-icon.png"
                                            alt="Ícono ROSÉ Lencería"
                                            className="absolute left-1/2 top-[-22px] w-[92px] max-w-none -translate-x-1/2"
                                        />
                                    </div>
                                    <button
                                        onClick={() => setShowMenu(false)}
                                        className="p-2 rounded-full hover:bg-roseBlush text-roseDark transition-colors"
                                    >
                                        <Icons.X />
                                    </button>
                                </div>

                                <div className="flex-1 p-4">
                                    <div className="space-y-1">
                                        {CATEGORIES.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => {
                                                    setSelectedCategory(cat);
                                                    setSearchQuery("");
                                                    setShowMenu(false);
                                                }}
                                                className={`w-full rounded-xl p-3 text-left text-xs font-brand font-bold tracking-wide transition-all ${selectedCategory === cat
                                                    ? 'bg-roseMagenta text-white shadow-sm'
                                                    : 'text-roseDark hover:bg-roseBlush'
                                                    }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showCart && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            {/* Backdrop */}
                            <div
                                className="absolute inset-0 bg-roseDark/60 backdrop-blur-sm transition-opacity"
                                onClick={() => setShowCart(false)}
                            />

                            {/* Cart Sidebar Panel */}
                            <div className="relative h-full w-full max-w-md bg-white shadow-2xl flex flex-col animate-slide-in sm:max-w-lg">
                                {/* Drawer Header */}
                                <div className="p-4 border-b border-roseAccent flex items-center justify-between bg-roseSoftBg">
                                    <div className="flex items-center gap-2">
                                        <Icons.Bag />
                                        <h3 className="font-brand font-bold text-sm tracking-widest uppercase text-roseDark">Tu Carrito de Compras</h3>
                                    </div>
                                    <button
                                        onClick={() => setShowCart(false)}
                                        className="p-2 rounded-full hover:bg-roseBlush text-roseDark transition-colors"
                                    >
                                        <Icons.X />
                                    </button>
                                </div>

                                {/* Cart Items List */}
                                <div className="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll">
                                    {cart.length === 0 ? (
                                        <div className="h-full flex flex-col items-center justify-center text-center p-6 text-gray-400">
                                            <div className="w-16 h-16 rounded-full bg-roseBlush flex items-center justify-center text-roseMagenta mb-3">
                                                <Icons.Bag />
                                            </div>
                                            <p className="font-brand font-bold text-sm text-roseDark uppercase">El carrito está vacío</p>
                                            <p className="text-xs text-gray-500 mt-1">Elegí tus prendas preferidas para agregarlas aquí.</p>
                                        </div>
                                    ) : (
                                        <>
                                            {cart.map(item => (
                                                <div
                                                    key={item.cartItemId}
                                                    className="flex gap-3 bg-roseSoftBg p-3 rounded-2xl border border-roseAccent/60 relative group"
                                                >
                                                    <img
                                                        src={item.image}
                                                        alt={item.name}
                                                        className="w-16 h-20 object-cover rounded-xl shrink-0"
                                                    />
                                                    <div className="flex-1 min-w-0 flex flex-col justify-between">
                                                        <div>
                                                            <div className="flex justify-between items-start pr-5">
                                                                <h4 className="font-brand font-bold text-xs uppercase tracking-tight text-roseDark truncate">{item.name}</h4>
                                                            </div>
                                                            <div className="flex gap-2 mt-1">
                                                                <span className="text-[10px] font-bold bg-white text-roseMagenta px-2 py-0.5 rounded border border-roseAccent">
                                                                    Talle: {item.selectedSize}
                                                                </span>
                                                                <span className="text-[10px] font-semibold bg-white text-gray-600 px-2 py-0.5 rounded border border-gray-200 truncate">
                                                                    {item.selectedColor}
                                                                </span>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center justify-between mt-2">
                                                            <div className="flex items-center gap-2 bg-white rounded-lg border border-roseAccent px-2 py-0.5 shadow-sm">
                                                                <button
                                                                    onClick={() => updateCartQuantity(item.cartItemId, -1)}
                                                                    className="text-roseDark p-1 hover:text-roseMagenta"
                                                                >
                                                                    <Icons.Minus />
                                                                </button>
                                                                <span className="text-xs font-bold text-roseDark w-4 text-center">{item.quantity}</span>
                                                                <button
                                                                    onClick={() => updateCartQuantity(item.cartItemId, 1)}
                                                                    className="text-roseDark p-1 hover:text-roseMagenta"
                                                                >
                                                                    <Icons.Plus />
                                                                </button>
                                                            </div>

                                                            <span className="font-brand font-bold text-sm text-roseMagenta">
                                                                ${(item.price * item.quantity).toLocaleString('es-AR')}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    <button
                                                        onClick={() => removeFromCart(item.cartItemId)}
                                                        className="absolute top-2 right-2 text-gray-400 hover:text-roseMagenta p-1"
                                                    >
                                                        <Icons.X />
                                                    </button>
                                                </div>
                                            ))}

                                            {/* Shipping Options */}
                                            <div className="pt-4 space-y-2 border-t border-roseAccent">
                                                <label className="block text-[11px] font-brand font-bold uppercase tracking-wider text-roseDark flex items-center gap-1.5">
                                                    <Icons.Truck /> Forma de Entrega:
                                                </label>
                                                <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                                                    {[
                                                        { key: 'retiro', title: 'Retiro en Showroom / Local', cost: 'GRATIS' },
                                                        { key: 'caba', title: 'Envío Mensajería CABA', cost: `$${shippingCosts.caba.toLocaleString('es-AR')}` },
                                                        { key: 'gba', title: 'Envío Mensajería GBA', cost: `$${shippingCosts.gba.toLocaleString('es-AR')}` },
                                                        { key: 'correo', title: 'Envío Correo Argentino', cost: `$${shippingCosts.correo.toLocaleString('es-AR')}` }
                                                    ].map(option => (
                                                        <button
                                                            key={option.key}
                                                            onClick={() => setShippingType(option.key)}
                                                            className={`flex items-center justify-between p-3 rounded-xl border text-xs font-medium transition-all ${shippingType === option.key
                                                                ? 'bg-roseBlush border-roseMagenta text-roseDark font-bold'
                                                                : 'bg-white border-gray-200 text-gray-600'
                                                                }`}
                                                        >
                                                            <span>{option.title}</span>
                                                            <span className="font-bold text-roseMagenta">{option.cost}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Customer Order Notes */}
                                            <div className="pt-2">
                                                <label className="block text-[11px] font-brand font-bold uppercase tracking-wider text-roseDark mb-1">
                                                    Aclaraciones o Nota para el pedido (Opcional):
                                                </label>
                                                <textarea
                                                    rows="2"
                                                    placeholder="Ej: Prefiero retirar por la tarde / Empacar para regalo..."
                                                    value={customerNotes}
                                                    onChange={(e) => setCustomerNotes(e.target.value)}
                                                    className="w-full text-xs p-2.5 rounded-xl border border-roseAccent bg-roseSoftBg focus:outline-none focus:ring-1 focus:ring-roseMagenta"
                                                ></textarea>
                                            </div>
                                        </>
                                    )}
                                </div>

                                {/* Cart Footer Summary & WhatsApp Submit Button */}
                                {cart.length > 0 && (
                                    <div className="p-4 bg-white border-t border-roseAccent space-y-3 shadow-lg">
                                        <div className="space-y-1.5 text-xs text-gray-600">
                                            <div className="flex justify-between">
                                                <span>Subtotal Productos</span>
                                                <span className="font-semibold text-roseDark">${subtotal.toLocaleString('es-AR')}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Costo de Envío</span>
                                                <span className="font-semibold text-roseDark">
                                                    {shippingPrice === 0 ? 'GRATIS' : `$${shippingPrice.toLocaleString('es-AR')}`}
                                                </span>
                                            </div>
                                            <div className="flex justify-between text-base font-brand font-bold text-roseDark pt-2 border-t border-gray-100">
                                                <span>TOTAL ESTIMADO</span>
                                                <span className="text-roseMagenta">${total.toLocaleString('es-AR')}</span>
                                            </div>
                                        </div>

                                        <button
                                            onClick={handleCheckoutWhatsApp}
                                            className="w-full py-3.5 rounded-2xl bg-roseMagenta hover:bg-roseDark text-white font-brand font-bold text-xs tracking-widest uppercase flex items-center justify-center gap-2 shadow-lg active:scale-98 transition-all"
                                        >
                                            <Icons.WhatsApp />
                                            ENVIAR PEDIDO POR WHATSAPP
                                        </button>
                                        <button
                                            onClick={clearCart}
                                            className="w-full py-2 rounded-xl border border-roseMagenta/60 text-roseMagenta hover:bg-roseMagenta hover:text-white font-brand font-bold text-[10px] tracking-widest uppercase transition-all"
                                        >
                                            Vaciar carrito
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Floating Sticky Bottom Cart Button (Mobile Quick Access) */}
                    {cart.length > 0 && !showCart && (
                        <div className="fixed bottom-4 left-4 right-4 z-20 mx-auto max-w-md sm:max-w-xl">
                            <button
                                onClick={() => setShowCart(true)}
                                className="w-full bg-roseDark text-white p-4 rounded-2xl flex items-center justify-between shadow-2xl hover:bg-roseMagenta active:scale-98 transition-all border border-roseAccent"
                            >
                                <div className="flex items-center gap-3">
                                    <div className="relative">
                                        <Icons.Bag />
                                        <span className="absolute -top-2 -right-2 bg-roseMagenta text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">
                                            {cart.reduce((a, b) => a + b.quantity, 0)}
                                        </span>
                                    </div>
                                    <span className="font-brand font-bold text-xs tracking-wider uppercase">Ver Carrito</span>
                                </div>
                                <div className="font-brand font-extrabold text-sm text-roseAccent">
                                    ${total.toLocaleString('es-AR')}
                                </div>
                            </button>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-16 bg-[#292929] px-5 py-10 text-center text-white">
                        <Icons.LogoRose dark />
                        <p className="mt-3 font-brand text-xs font-medium tracking-[0.18em] text-white/90">
                            Lencería pensada para vos
                        </p>
                        <div className="mt-5 flex items-center justify-center gap-3">
                            <a
                                href={`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent("¡Hola! Quisiera hacer una consulta.")}`}
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Contactarnos por WhatsApp"
                                className="flex h-10 w-10 items-center justify-center rounded-full border border-white/25 text-white transition-colors hover:border-roseMagenta hover:bg-roseMagenta"
                            >
                                <Icons.WhatsApp />
                            </a>
                            <a
                                href="https://www.instagram.com/lenceria.rose_?igsh=aWw3NTRsdGprd3ph&igsi=aWw3NTRsdGprd3ph"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Seguinos en Instagram"
                                className="flex h-10 w-10 items-center justify-center rounded-full border border-white/25 text-white transition-colors hover:border-roseMagenta hover:bg-roseMagenta"
                            >
                                <Icons.Instagram />
                            </a>
                        </div>
                        <p className="mt-6 text-[9px] text-white/50">
                            © 2026 ROSÉ LENCERÍA. Todos los derechos reservados.
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
